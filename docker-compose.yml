version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fits_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB:       ${DB_NAME:-fits_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fits_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FITS Processor (API + Frontend) ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fits_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DB_HOST:     db
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME:     ${DB_NAME:-fits_db}
      DB_SSLMODE:  ${DB_SSLMODE:-disable}

      # Auth — MUST be changed in production
      JWT_ACCESS_SECRET:  ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      ADMIN_EMAIL:        ${ADMIN_EMAIL:-admin@fits.local}
      ADMIN_PASSWORD:     ${ADMIN_PASSWORD:-}
      TRUSTED_PROXIES:    ${TRUSTED_PROXIES:-}
      COOKIE_SECURE:      ${COOKIE_SECURE:-true}
      JWT_ACCESS_TTL:     ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL:    ${JWT_REFRESH_TTL:-168h}

      # CORS — set to your actual frontend origin in production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # FITS scanning
      FITS_SCAN_DIR: ${FITS_SCAN_DIR:-/data/fits}
      FITS_WORKERS:  ${FITS_WORKERS:-4}

      # App
      APP_ENV:       ${APP_ENV:-production}
      LOG_LEVEL:     ${LOG_LEVEL:-info}
      LOG_DIR:       /app/logs
      MIGRATIONS_DIR: migrations
      STATIC_DIR:    /app/static
      SERVER_ADDR:   :8080

    ports:
      - "${APP_PORT:-8080}:8080"

    volumes:
      # Mount your FITS files directory here
      - ${FITS_DATA_DIR:-./testdata}:/data/fits:ro
      # Persist log files
      - app_logs:/app/logs

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  app_logs:
